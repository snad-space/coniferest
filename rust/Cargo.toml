[package]
name = "coniferest"
version = "0.2.1"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib"]

# We'd like to build fast code with `pip install -e '.[dev]'`
[profile.dev]
opt-level = 3

# Makes linking slower, but the resulting extension module is faster
[profile.release]
lto = true
codegen-units = 1

# `bench` inherits from `release` by default; full LTO leaves the pyo3
# extension-module symbols unresolved when linking the bench binary (it's a
# standalone executable, not a Python-loaded cdylib), so keep it off here.
[profile.bench]
lto = false
codegen-units = 16

[features]
default = ["pyo3/abi3-py310"]

[dependencies]
itertools = "0.15"
# 0.29.1 fixes https://github.com/PyO3/pyo3/issues/6211 (__inplace_concat__)
pyo3 = { version = "0.29.1", features = ["extension-module"] }
# Needs to be consistent with ndarray dependency in numpy
ndarray = { version = "0.17", features = ["rayon"] }
num-traits = "0.2"
numpy = "0.29.0"
# Needs to be consistent with rayon dependency in ndarray
rayon = "1.12"
ordered-float = "5.3.0"
rand = "0.10"
rand_xoshiro = "0.8"

[dev-dependencies]
allocation-counter = "0.8"
